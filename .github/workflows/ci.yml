name: BAY-E CI

on:
  push:
    branches:
      - main
      - integration/**
      - feature/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app main.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript
        run: |
          node --check static/js/app.js
          node --check static/js/ws.js
          node --check static/js/face.js
          node --check static/js/views.js
      - name: Import app
        run: python -c "from main import app; print(app.title)"