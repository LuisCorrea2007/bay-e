name: BAY-E Redesign Runtime

on:
  push:
    branches:
      - redesign/grok-chat-openai
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BAY-E and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start BAY-E
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8300 > /tmp/baye.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8300/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/baye.log
          exit 1
      - name: Capture redesign
        run: python scripts/capture_redesign.py
      - name: Print server log
        if: always()
        run: cat /tmp/baye.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baye-redesign-screenshots
          path: redesign-shots/
          if-no-files-found: error
