name: BAY-E Web Runtime

on:
  push:
    branches:
      - main
      - integration/**
      - feature/**
      - release/**
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start BAY-E
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8300 >/tmp/baye.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8300/health >/dev/null; then
              curl -fsS http://127.0.0.1:8300/api/v1/state >/dev/null
              curl -fsS http://127.0.0.1:8300/api/state >/dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/baye.log
          exit 1
      - name: Test chat and mind UI
        run: |
          cat >/tmp/test_ui.py <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path("runtime"); out.mkdir(exist_ok=True)
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True, args=["--disable-dev-shm-usage"])
              page=b.new_page(viewport={"width":1440,"height":950})
              page.on("console", lambda msg: print("BROWSER", msg.type, msg.text))
              page.on("pageerror", lambda exc: print("PAGEERROR", exc))
              page.goto("http://127.0.0.1:8300", wait_until="networkidle")
              assert page.evaluate("typeof document.querySelector('#send-btn').onclick === 'function'")
              assert page.locator("#face-main .eye").count() == 2
              assert page.locator("#face-main .bridge").count() == 1
              assert page.locator("#face-main").inner_text().strip() == ""
              assert page.locator("#wake-btn").count() == 1
              assert page.locator("#wake-btn").get_attribute("aria-pressed") == "false"
              assert page.evaluate("normalizedSpeech('BÁY-E')") == "bay-e"
              assert page.evaluate("wakePattern().test('hola bay e')") is True
              assert page.evaluate("wakePattern().test('hola baye')") is True
              page.screenshot(path=str(out/"baye-voice-ready.png"), full_page=True)
              page.click("#new-chat")
              page.wait_for_timeout(300)
              page.fill("#prompt","recuerda que la prueba móvil funciona")
              page.click("#send-btn")
              page.wait_for_function("!document.querySelector('#send-btn').disabled && document.querySelectorAll('.message .bubble').length >= 2", timeout=10000)
              assert page.locator(".message .bubble").count() >= 2
              page.locator(".message.user .message-tools [data-act=edit]").last.click()
              page.fill("#edit-text","recuerda que la prueba móvil funciona correctamente")
              page.click("#edit-save")
              page.wait_for_timeout(300)
              assert "correctamente" in page.locator(".message.user .bubble").last.inner_text()
              page.click("#mind-btn")
              page.fill("#rule-content","Nunca inventes que un sensor está conectado.")
              page.click("#rule-form button[type=submit]")
              page.wait_for_timeout(400)
              assert page.locator(".rule-card").count() >= 1
              page.screenshot(path=str(out/"baye-heart-mind.png"), full_page=True)
              page.click("#drawer-close")
              page.fill("#prompt","Me gusta el color turquesa de prueba")
              page.click("#send-btn")
              page.wait_for_function("!document.querySelector('#send-btn').disabled && document.querySelectorAll('.message .bubble').length >= 4", timeout=10000)
              page.click("[data-panel=learning]")
              page.wait_for_timeout(300)
              assert page.locator(".learning-card").count() >= 1
              assert "turquesa" in page.locator(".learning-card p").first.inner_text().lower()
              page.locator(".learning-card [data-a=approve]").first.click()
              page.wait_for_timeout(350)
              assert page.locator(".learning-card").count() == 0
              page.screenshot(path=str(out/"baye-learning.png"), full_page=True)
              page.click("#drawer-close")
              page.fill("#chat-search","turquesa")
              page.wait_for_timeout(500)
              assert page.locator(".search-hit").count() >= 1
              page.screenshot(path=str(out/"baye-chat-search.png"), full_page=True)
              page.fill("#chat-search","")
              page.wait_for_timeout(250)
              page.click("[data-panel=control]")
              page.wait_for_timeout(200)
              page.click("[data-move=forward]")
              page.wait_for_timeout(250)
              assert "desconectado" in page.locator("#control-hardware").inner_text().lower()
              page.screenshot(path=str(out/"baye-control.png"), full_page=True)
              page.click("[data-panel=devices]")
              page.wait_for_timeout(200)
              page.click("#pair-mobile-btn")
              page.wait_for_timeout(250)
              code=page.locator("#pair-code-value").inner_text().strip()
              assert len(code) == 6 and code.isdigit()
              page.screenshot(path=str(out/"baye-mobile-pairing.png"), full_page=True)
              b.close()
          PY
          python /tmp/test_ui.py
      - name: Print BAY-E server log on failure
        if: failure()
        run: cat /tmp/baye.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: BAY-E-web-runtime
          path: runtime/