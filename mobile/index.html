<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <title>BAY-E Mobile</title>
</head>
<body>
  <div id="app">
    <header class="mobile-head">
      <div class="mini-face"><b></b><i></i><b></b></div>
      <div><strong>BAY-E</strong><small id="status">sin conectar</small></div>
      <button id="settings-btn">⚙</button>
    </header>

    <main id="chat">
      <section class="mobile-hero" id="hero">
        <div class="face" id="face"><span></span><i></i><span></span></div>
        <h1>Estoy contigo.</h1>
        <p>Este teléfono puede ser mis oídos, ojos y sensores cuando tú lo autorices.</p>
      </section>
      <div id="messages" class="messages"></div>
    </main>

    <section class="sensor-strip">
      <button id="camera-btn"><span>◉</span>Cámara</button>
      <button id="mic-btn"><span>⌁</span>Hablar</button>
      <button id="location-btn"><span>⌖</span>Ubicación</button>
      <button id="sensor-btn"><span>↯</span>Sensores</button>
    </section>

    <div class="composer">
      <textarea id="prompt" rows="1" placeholder="Habla con BAY-E…"></textarea>
      <button id="send">↑</button>
    </div>

    <dialog id="settings">
      <form method="dialog">
        <h2>Conectar con BAY-E Core</h2>
        <label>URL local del Core<input id="core-url" placeholder="http://192.168.1.20:8300"></label>
        <p>El teléfono y la computadora deben estar en la misma red local. La ubicación solo se comparte cuando pulsas el botón correspondiente.</p>
        <div class="dialog-actions"><button value="cancel">Cancelar</button><button id="save-settings" value="default">Guardar</button></div>
      </form>
    </dialog>

    <div class="toast" id="toast"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
