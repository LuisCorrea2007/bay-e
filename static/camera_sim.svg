<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- BAY-E · Fotograma simulado de cámara (sustituible por MJPEG real). -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a44"/><stop offset="1" stop-color="#101c30"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2018"/><stop offset="1" stop-color="#171009"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".85"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#wall)"/>
  <rect y="240" width="640" height="120" fill="url(#floor)"/>
  <!-- ventana con luz de tarde -->
  <rect x="60" y="60" width="150" height="120" rx="6" fill="#28405f" stroke="#3d5a80" stroke-width="4"/>
  <line x1="135" y1="60" x2="135" y2="180" stroke="#3d5a80" stroke-width="4"/>
  <line x1="60" y1="120" x2="210" y2="120" stroke="#3d5a80" stroke-width="4"/>
  <circle cx="180" cy="90" r="26" fill="#ffe9c4" opacity=".9"/>
  <!-- sofá -->
  <rect x="280" y="180" width="230" height="70" rx="16" fill="#23385a"/>
  <rect x="270" y="150" width="250" height="52" rx="16" fill="#2b446c"/>
  <rect x="292" y="158" width="60" height="40" rx="10" fill="#355481"/>
  <rect x="365" y="158" width="60" height="40" rx="10" fill="#355481"/>
  <!-- gato Mini sobre el sofá -->
  <ellipse cx="455" cy="168" rx="34" ry="16" fill="#5a4632"/>
  <circle cx="486" cy="160" r="12" fill="#5a4632"/>
  <path d="M478 152 l4 -8 4 8 z M490 152 l4 -8 4 8" fill="#5a4632"/>
  <path d="M424 166 q-14 4 -8 14" stroke="#5a4632" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- lámpara -->
  <circle cx="580" cy="120" r="70" fill="url(#lamp)"/>
  <path d="M566 100 h28 l-6 22 h-16 z" fill="#e8c48a"/>
  <line x1="580" y1="122" x2="580" y2="240" stroke="#7a6a52" stroke-width="5"/>
  <!-- planta -->
  <rect x="30" y="230" width="34" height="34" rx="6" fill="#6b4a35"/>
  <path d="M47 230 q-20 -30 -6 -52 M47 230 q2 -34 20 -46 M47 230 q16 -18 30 -12" stroke="#3f7d54" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- alfombra -->
  <ellipse cx="330" cy="300" rx="180" ry="30" fill="#1d2f4a" opacity=".8"/>
  <!-- mesa baja + taza -->
  <rect x="300" y="262" width="110" height="10" rx="4" fill="#4a3626"/>
  <rect x="310" y="272" width="8" height="26" fill="#3a2a1e"/><rect x="392" y="272" width="8" height="26" fill="#3a2a1e"/>
  <rect x="340" y="248" width="16" height="14" rx="3" fill="#dfe9f5"/>
  <path d="M356 252 q8 2 0 8" stroke="#dfe9f5" stroke-width="3" fill="none"/>
  <!-- pelota roja bajo el sofá -->
  <circle cx="320" cy="236" r="8" fill="#c0392b"/>
  <!-- viñeta + ruido de sensor -->
  <rect width="640" height="360" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="60" opacity=".35"/>
  <text x="12" y="20" font-family="monospace" font-size="12" fill="#5eeaff" opacity=".8">BAY-E CAM · SALÓN · ISO 800 · f/2.0</text>
  <text x="560" y="350" font-family="monospace" font-size="11" fill="#ff6b81" opacity=".9">● REC</text>
</svg>
