<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BAY-E</title>
  <link rel="stylesheet" href="/static/css/baye.css">
</head>
<body>
  <div class="app-shell">
    <aside class="side-rail">
      <button class="brand" data-action="home" aria-label="BAY-E">
        <span class="brand-eye"></span><span class="brand-eye"></span>
      </button>
      <button class="rail-action primary" data-action="new-chat" title="Nueva conversación">＋</button>
      <div class="rail-spacer"></div>
      <button class="rail-action" data-panel="mind" title="Mente">◌</button>
      <button class="rail-action" data-panel="memory" title="Memoria">◇</button>
      <button class="rail-action" data-panel="vision" title="Visión">◉</button>
      <button class="rail-action" data-panel="system" title="Sistema">⚙</button>
    </aside>

    <main class="chat-stage">
      <header class="topbar">
        <div class="identity">
          <div id="face-mini" class="face-mini"></div>
          <div>
            <strong>BAY-E</strong>
            <span id="status-line">iniciando…</span>
          </div>
        </div>
        <div class="top-actions">
          <span class="provider-pill" id="provider-pill">IA · comprobando</span>
          <button class="ghost-btn" id="inspector-toggle">Estado</button>
        </div>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <div id="face-hero" class="face-hero"></div>
          <h1>Hola. Soy BAY-E.</h1>
          <p>Háblame como a un compañero. Puedo recordar, organizar, observar, aprender y controlar mis funciones desde esta conversación.</p>
          <div class="suggestions">
            <button data-prompt="¿Qué recuerdas de mí?">¿Qué recuerdas de mí?</button>
            <button data-prompt="¿Cómo te sientes ahora?">¿Cómo te sientes?</button>
            <button data-prompt="Muéstrame tu diagnóstico del sistema">Diagnóstico</button>
            <button data-prompt="¿Qué sabes de la casa?">Mundo conocido</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <button class="composer-icon" id="voice-btn" title="Hablar">⌁</button>
          <textarea id="chat-input" rows="1" placeholder="Habla con BAY-E…" maxlength="5000"></textarea>
          <button class="send-btn" id="send-btn" aria-label="Enviar">↑</button>
        </div>
        <div class="composer-meta">
          <span id="activity-label">Listo</span>
          <span>Enter para enviar · Shift+Enter para nueva línea</span>
        </div>
      </div>
    </main>

    <aside class="inspector" id="inspector">
      <div class="inspector-head">
        <div>
          <small>EN VIVO</small>
          <h2 id="panel-title">Mente</h2>
        </div>
        <button class="close-btn" id="panel-close">×</button>
      </div>

      <section class="panel-view active" data-view="mind">
        <div class="state-orb">
          <div id="face-panel"></div>
          <div>
            <strong id="mind-emotion">—</strong>
            <span id="mind-activity">—</span>
          </div>
        </div>
        <div class="metric-grid" id="emotion-grid"></div>
        <div class="info-card">
          <label>Pensamiento operativo</label>
          <p id="mind-thought">—</p>
        </div>
        <div class="info-card">
          <label>Siguiente decisión</label>
          <p id="mind-next">—</p>
        </div>
        <div class="quick-stack">
          <button data-prompt="Activa autonomía">Activar autonomía</button>
          <button data-prompt="Entra en modo reposo">Descansar</button>
          <button data-prompt="¿Cuál es tu estado actual?">Explicar estado</button>
        </div>
      </section>

      <section class="panel-view" data-view="memory">
        <div class="panel-search">
          <input id="memory-search" placeholder="Buscar recuerdos…">
        </div>
        <div id="memory-list" class="memory-list"></div>
      </section>

      <section class="panel-view" data-view="vision">
        <div class="camera-card">
          <div class="camera-empty" id="camera-empty">
            <span>◉</span>
            <strong>Visión</strong>
            <small id="vision-status">comprobando adaptador…</small>
          </div>
        </div>
        <div id="vision-detections" class="detection-list"></div>
        <button class="panel-primary" data-prompt="¿Qué ves ahora mismo?">Preguntar qué ve</button>
      </section>

      <section class="panel-view" data-view="system">
        <div id="diagnostics" class="diagnostics"></div>
        <button class="panel-primary" data-prompt="Muéstrame tu diagnóstico del sistema">Explicar por chat</button>
      </section>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/static/js/face.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
